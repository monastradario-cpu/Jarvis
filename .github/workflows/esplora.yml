name: Esplora sherpa
on:
  push:
    branches: [esplora]
jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - run: |
          TAG=v1.13.8; V=1.13.8
          curl -sSL -o x.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/$TAG/sherpa-onnx-$V.aar"
          unzip -l x.aar | grep -v "x86" > a1.txt
          mkdir aar && cd aar && unzip -q ../x.aar && unzip -l classes.jar | grep -i tts > ../a2.txt; cd ..
          curl -sSL "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$TAG/sherpa-onnx/kotlin-api/Tts.kt" > tts.txt
          wc -l tts.txt >> a2.txt
          curl -sSL -o v.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-it_IT-paola-medium-int8.tar.bz2" && tar tjf v.tar.bz2 | grep -v "espeak-ng-data/.*/" | head -20 >> a2.txt
          tar tjf v.tar.bz2 | wc -l >> a2.txt
          for f in a1.txt a2.txt; do M=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' $f); echo "::notice title=$f::$M"; done
          split -l 70 tts.txt parte_
          for f in parte_*; do M=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' $f); echo "::notice title=$f::$M"; done
