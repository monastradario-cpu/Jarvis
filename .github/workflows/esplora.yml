name: Dipendenze sherpa
on:
  push:
    branches: [esplora]
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o x.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          mkdir a && cd a && unzip -q ../x.aar
          { for f in jni/arm64-v8a/*.so; do echo "== $f"; readelf -d $f | grep NEEDED; done; echo; cat AndroidManifest.xml; echo; cat META-INF/com/android/build/gradle/aar-metadata.properties; } > ../o.txt 2>&1
          cd ..; M=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' o.txt); echo "::notice title=risultato::$M"
