name: Esplora sherpa
on:
  push:
    branches: [esplora]
jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
          TAG=$(curl -sSL https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          echo "TAG $TAG"
          curl -sSL https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest | python3 -c "
          import sys,json
          for a in json.load(sys.stdin)['assets']:
              n=a['name']
              if 'android' in n.lower() or n.endswith('.aar'): print(n, a['size'], a['browser_download_url'])
          "
          curl -sSL "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/tts-models" | python3 -c "
          import sys,json
          for a in json.load(sys.stdin)['assets']:
              n=a['name']
              if 'it_IT' in n or 'it-IT' in n: print(n, a['size'])
          "
          V=${TAG#v}
          curl -sSL -o a.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/$TAG/sherpa-onnx-$TAG-android.tar.bz2" && tar tjf a.tar.bz2 | head -30
          ls -la a.tar.bz2
          curl -sSL -o x.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/$TAG/sherpa-onnx-$V.aar" && unzip -l x.aar | head -40
          echo ==== Tts.kt
          curl -sSL "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$TAG/sherpa-onnx/kotlin-api/Tts.kt" | head -150
          } > out.txt 2>&1
          M=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' out.txt)
          echo "::notice title=risultato::$M"
