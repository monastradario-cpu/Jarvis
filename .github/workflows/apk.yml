name: Costruisci APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Scarica il modello per la parola di attivazione
        run: |
          curl -sSL -o modello.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q modello.zip
          mkdir -p app/src/main/assets/model-en-us
          cp -r vosk-model-small-en-us-0.15/* app/src/main/assets/model-en-us/
          echo "vosk-model-small-en-us-0.15" > app/src/main/assets/model-en-us/uuid
          du -sh app/src/main/assets/model-en-us
          # Modello per riconoscere la voce dell'utente
          curl -sSL -o voce.zip https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip
          unzip -q voce.zip
          mkdir -p app/src/main/assets/model-spk
          cp -r vosk-model-spk-0.4/* app/src/main/assets/model-spk/
          echo "vosk-model-spk-0.4" > app/src/main/assets/model-spk/uuid
          du -sh app/src/main/assets/model-spk

      - name: Costruisci l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Pubblica l'APK nelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis ${{ github.run_number }}
          body: "Scarica **Jarvis.apk** qui sotto e installalo sul telefono."
          files: Jarvis.apk
          make_latest: true
