name: Costruisci, collauda e pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  # 1. Costruisce l'APK per il telefono (arm64)
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Scarica modelli e librerie
        run: bash .github/prepara.sh
      - name: Controlla i nomi nel vocabolario vocale
        run: |
          V=$(find app/src/main/assets/model-it -name "words.txt" | head -1)
          F=$(find app/src/main/assets/model-it -type f | sed 's#app/src/main/assets/model-it/##' | tr '\n' ' ')
          if [ -n "$V" ]; then
            R=""; for w in guizzo orione atlante vega aurelio nucleo jarvis scintilla estro; do if grep -qw "^$w" "$V"; then R="$R $w:si"; else R="$R $w:no"; fi; done
            echo "::notice title=vocabolario::$R"
          else
            echo "::notice title=vocabolario::nessun words.txt. File: $F"
          fi
      - name: Costruisci l'APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Riporta gli errori di compilazione
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|AAPT|Execution failed|> " build.log | grep -v "^> Task" | head -60 > errori.txt || true
          M=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errori.txt)
          echo "::error title=compilazione::$M"
      - run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: Jarvis.apk

  # 2. Pubblica l'APK appena compilato
  pubblica:
    needs: [costruisci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis ${{ github.run_number }}
          body: "Scarica **Jarvis.apk** qui sotto e installalo."
          files: Jarvis.apk
          make_latest: true
