name: Costruisci APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Costruisci l'APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rinomina l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk

      - name: Pubblica l'APK nelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis ${{ github.run_number }}
          body: "Scarica **Jarvis.apk** qui sotto e installalo sul telefono."
          files: Jarvis.apk
          make_latest: true
